services:
  app:
    build: .
    ports:
      - "127.0.0.1:${PORT:-8080}:3000"
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
    volumes:
      - workspace-data:/data
    restart: unless-stopped

volumes:
  workspace-data:
